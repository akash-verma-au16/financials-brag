<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url(inter.woff2) format("woff2"); font-weight: 100 900; }
  :root {
    --bg: #e9e4db; --bg-deep: #e2ddd3; --panel: #efeae2; --raised: #f2eee7;
    --ink: #221f19; --ink-2: #4f4b44; --ink-3: #66625a;
    --border: #d4cdc1; --accent: #3a60aa; --accent-subtle: #d9e2f1; --pos: #00705f;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1200px 700px at 50% 40%, #f0ebe3 0%, var(--bg) 60%, var(--bg-deep) 100%); }
  .layer { position: absolute; inset: 0; will-change: transform, opacity; }

  .headline { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; letter-spacing: -0.035em; }
  .chip { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 26px; border-radius: 999px;
    background: var(--raised); border: 1.5px solid var(--border); font-size: 30px; font-weight: 500; color: var(--ink-2);
    box-shadow: 0 10px 30px rgba(60,50,30,.08); white-space: nowrap; }
  .chip i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .chip span { color: var(--ink-3); font-weight: 400; font-size: 24px; }

  .logo { position: absolute; width: 150px; height: 150px; }
  .wordmark { position: absolute; left: 0; right: 0; text-align: center; font-size: 104px; font-weight: 650; letter-spacing: -0.045em; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 46px; font-weight: 450; color: var(--ink-2); letter-spacing: -0.02em; }

  .shot { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
    background-size: 1920px 1080px; border-radius: 22px; overflow: hidden;
    box-shadow: 0 2px 0 rgba(255,255,255,.5) inset, 0 40px 90px rgba(50,40,20,.18), 0 0 0 1.5px var(--border); }
  .caption { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); white-space: nowrap;
    padding: 22px 40px; border-radius: 22px; background: rgba(34,31,25,.88); color: #f3f1ec;
    font-size: 44px; font-weight: 550; letter-spacing: -0.025em; box-shadow: 0 20px 50px rgba(30,25,15,.25); }
  .cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); }
  .ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 4px solid var(--accent); }
  .foot { position: absolute; left: 0; right: 0; bottom: 54px; text-align: center; font-size: 22px; color: var(--ink-3); }
</style>
</head>
<body>
<div id="stage">
  <!-- 1 + 2: hook and reveal -->
  <div class="layer" id="s12">
    <div class="headline" id="hook" style="top: 470px; font-size: 92px;">Your money lives in too many places.</div>
    <div id="chips"></div>
    <svg class="logo" id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#3e66b3"/><path d="M8 22l5-6 4 3 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="wordmark" id="wm" style="top: 520px;">Financials</div>
    <div class="sub" id="tag" style="top: 668px;">One private page for all of it.</div>
  </div>

  <!-- 3–5: the real app -->
  <div class="layer" id="app">
    <div class="shot" id="shot"></div>
    <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path d="M4 2l15 11-6.5 1.2 3.8 7.3-2.6 1.3-3.8-7.3L5 20z" fill="#221f19" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <div class="ripple" id="ripple"></div>
    <div class="caption" id="cap"></div>
  </div>

  <!-- 6: outro -->
  <div class="layer" id="s6">
    <svg class="logo" id="logo2" viewBox="0 0 32 32" style="left: 885px; top: 250px;"><rect width="32" height="32" rx="8" fill="#3e66b3"/><path d="M8 22l5-6 4 3 7-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="wordmark" id="wm2" style="top: 420px; font-size: 88px;">Financials</div>
    <div class="sub" id="o1" style="top: 590px;">Try it yourself. The demo runs in your browser.</div>
    <div class="sub" id="o2" style="top: 676px; color: var(--accent); font-weight: 600; font-size: 40px;">akash-verma-au16.github.io/financials-brag/app</div>
    <div class="foot" id="foot">Demo data only. Every name and number is fictional.</div>
  </div>
</div>

<script>
const B = 0.625; // 96 BPM
const T = { hook: 0, reveal: 5 * B, overview: 9 * B, spending: 17 * B, proj: 23 * B, outro: 29 * B, end: 34 * B };
window.DURATION = T.end;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const $ = (id) => document.getElementById(id);
const show = (el, o, dy = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translateY(${dy}px) scale(${s})`; };
const enter = (t, at, dur = 0.5, rise = 24) => { const k = out(prog(t, at, at + dur)); return [k, (1 - k) * rise]; };

// Hook chips: the demo accounts, scattered around the headline.
const CHIPS = [
  ["Everyday Chequing", "Maple Bank", "#3a60aa", 220, 210],
  ["Rewards Visa", "Maple Bank", "#a83416", 1240, 170],
  ["TFSA", "Lakeside Invest", "#00705f", 1380, 330],
  ["RRSP", "Lakeside Invest", "#7b5cc4", 150, 720],
  ["FHSA", "Lakeside Invest", "#2f8f9d", 1260, 700],
  ["Group Pension Plan", "Pinecrest Life", "#c2852a", 640, 850],
];
const chipEls = CHIPS.map(([a, b, c]) => {
  const d = document.createElement("div");
  d.className = "chip";
  d.innerHTML = `<i style="background:${c}"></i>${a}<span>${b}</span>`;
  $("chips").appendChild(d);
  return d;
});

// Camera keyframes per app scene: [localTime, cx, cy, scale] in screenshot pixels.
const SCENES = [
  { start: T.overview, end: T.spending, img: "shots/overview2x.png", cap: "Net worth, debt and cash at a glance.",
    cam: [[0, 960, 640, 0.78], [1.4, 960, 600, 0.78], [3.2, 1064, 372, 1.38], [5, 1080, 380, 1.42]],
    cursor: [[1.6, 1500, 900], [3.0, 470, 250], [5, 486, 256]], click: null },
  { start: T.spending, end: T.proj, img: "shots/spending2x.png", cap: "Every month, every category.",
    cam: [[0, 960, 640, 0.78], [1.5, 960, 600, 0.78], [3.0, 1064, 445, 1.38], [3.75, 1072, 448, 1.41]],
    cursor: [[0.1, 1300, 950], [1.0, 891, 694], [3.75, 1200, 470]], click: 1.05 },
  { start: T.proj, end: T.outro, img: "shots/projections2x.png", cap: "And where it’s headed, 25 years out.",
    cam: [[0, 960, 640, 0.78], [1.0, 960, 600, 0.78], [3.75, 1066, 652, 1.36]],
    cursor: null, click: null },
];

function track(keys, lt) {
  if (lt <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [t1, ...v1] = keys[i], [t0, ...v0] = keys[i - 1];
    if (lt <= t1) { const k = ease((lt - t0) / (t1 - t0)); return v0.map((v, j) => lerp(v, v1[j], k)); }
  }
  return keys[keys.length - 1].slice(1);
}

window.setTime = function (t) {
  // ---- 1 + 2: hook and reveal
  const s12 = $("s12");
  s12.style.display = t < T.overview ? "block" : "none";
  if (t < T.overview) {
    const [hk, hy] = enter(t, 0.15, 0.55);
    const hookOut = 1 - ease(prog(t, T.reveal - 0.3, T.reveal));
    show($("hook"), hk * hookOut, hy);

    const gather = ease(prog(t, T.reveal, T.reveal + 0.8));
    chipEls.forEach((el, i) => {
      const [, , , x, y] = CHIPS[i];
      const [k, dy] = enter(t, 0.3 + i * 0.3125, 0.6, 30);
      const drift = Math.sin(t * 0.9 + i) * 6;
      const w = el.offsetWidth, h = el.offsetHeight;
      const cx = lerp(x, 960 - w / 2, gather), cy = lerp(y + dy + drift, 465 - h / 2, gather);
      el.style.left = cx + "px"; el.style.top = cy + "px";
      el.style.opacity = k * (1 - ease(prog(t, T.reveal + 0.45, T.reveal + 0.8)));
      el.style.transform = `scale(${lerp(1, 0.4, gather)})`;
    });

    const lk = out(prog(t, T.reveal + 0.55, T.reveal + 1.05));
    const logo = $("logo");
    logo.style.left = 885 + "px"; logo.style.top = 330 + "px";
    logo.style.opacity = lk; logo.style.transform = `scale(${lerp(0.6, 1, lk)}) rotate(${(1 - lk) * -8}deg)`;
    const sceneOut = 1 - ease(prog(t, T.overview - 0.3, T.overview));
    const [wk, wy] = enter(t, T.reveal + 0.75, 0.55);
    show($("wm"), wk * sceneOut, wy);
    const [tk, ty] = enter(t, T.reveal + 0.95, 0.55);
    show($("tag"), tk * sceneOut, ty);
    logo.style.opacity = lk * sceneOut;
  }

  // ---- 3–5: app scenes
  const sc = SCENES.find((s) => t >= s.start && t < s.end);
  $("app").style.display = sc ? "block" : "none";
  if (sc) {
    const lt = t - sc.start, len = sc.end - sc.start;
    const shot = $("shot");
    if (shot.dataset.img !== sc.img) { shot.style.backgroundImage = `url(${sc.img})`; shot.dataset.img = sc.img; }
    const [cx, cy, s] = track(sc.cam, lt);
    const fadeIn = out(prog(lt, 0, 0.45)), fadeOut = 1 - ease(prog(lt, len - 0.3, len));
    const rise = (1 - fadeIn) * 70;
    shot.style.transform = `translate(${960 - cx * s}px, ${540 - cy * s + rise}px) scale(${s})`;
    shot.style.borderRadius = 22 / s + "px";
    shot.style.opacity = fadeIn * fadeOut;

    const cur = $("cursor"), rip = $("ripple");
    if (sc.cursor && lt >= sc.cursor[0][0]) {
      const [px, py] = track(sc.cursor, lt);
      const press = sc.click != null ? 1 - 0.18 * Math.sin(Math.PI * prog(lt, sc.click - 0.08, sc.click + 0.12)) : 1;
      const sx = 960 + (px - cx) * s, sy = 540 + (py - cy) * s + rise;
      cur.style.display = "block";
      cur.style.opacity = out(prog(lt, sc.cursor[0][0], sc.cursor[0][0] + 0.3)) * fadeOut;
      cur.style.transform = `translate(${sx - 8}px, ${sy - 4}px) scale(${press})`;
      if (sc.click != null && lt >= sc.click && lt < sc.click + 0.6) {
        const k = out(prog(lt, sc.click, sc.click + 0.6));
        rip.style.display = "block"; rip.style.left = sx + "px"; rip.style.top = sy + "px";
        rip.style.opacity = 1 - k; rip.style.transform = `scale(${lerp(0.3, 1.4, k)})`;
      } else rip.style.display = "none";
    } else { cur.style.display = "none"; rip.style.display = "none"; }

    const cap = $("cap");
    cap.textContent = sc.cap;
    const ck = out(prog(lt, 0.35, 0.8));
    cap.style.opacity = ck * fadeOut;
    cap.style.transform = `translateX(-50%) translateY(${(1 - ck) * 20}px)`;
  }

  // ---- 6: outro
  const s6 = $("s6");
  s6.style.display = t >= T.outro ? "block" : "none";
  if (t >= T.outro) {
    const lk = out(prog(t, T.outro, T.outro + 0.5));
    $("logo2").style.opacity = lk;
    $("logo2").style.transform = `scale(${lerp(0.7, 1, lk)})`;
    const [wk, wy] = enter(t, T.outro + 0.1, 0.5); show($("wm2"), wk, wy);
    const [a, ay] = enter(t, T.outro + 0.35, 0.55); show($("o1"), a, ay);
    const [b, by] = enter(t, T.outro + 1.25, 0.55); show($("o2"), b, by);
    const [f] = enter(t, T.outro + 1.6, 0.6); show($("foot"), f);
  }
};

window.ready = Promise.all([
  document.fonts.load("600 40px Inter"),
  ...SCENES.map((s) => new Promise((r) => { const i = new Image(); i.onload = r; i.onerror = r; i.src = s.img; })),
]).then(() => document.fonts.ready).then(() => { window.setTime(0); return true; });
</script>
</body>
</html>
